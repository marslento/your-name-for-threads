name: CI

# Every pull request and every push to main is installed from the frozen lockfile, tested, built and audited (Phase 4
# Task 28, review checklist 31). This workflow only reads the repository: it has no secrets and publishes nothing, and a
# pull request from a fork can only ever read. Releasing is a separate workflow behind an approval gate (Tasks 37-41).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The pnpm version is the one package.json's "packageManager" names.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit the package
        run: pnpm release:audit
