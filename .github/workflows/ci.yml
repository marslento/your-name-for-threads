name: CI

# Tests, builds and audits the extension, then rehearses packaging as a downloadable candidate.
# This workflow has no store credentials or repository write permission. Production releases use release.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The pnpm version is the one package.json's "packageManager" names.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit the package
        run: pnpm release:audit

      - name: Create the candidate ZIP and audit its contents
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          zip="your-name-for-threads-${version}.zip"
          mkdir candidate
          node scripts/make-release-zip.mjs dist "candidate/${zip}"
          node scripts/make-release-zip.mjs dist candidate/second.zip
          cmp "candidate/${zip}" candidate/second.zip
          rm candidate/second.zip
          (cd candidate && sha256sum "$zip" > SHA256SUMS)
          node scripts/changelog-excerpt.mjs "$version" CHANGELOG.md candidate/release-notes.md
          unzip -t "candidate/${zip}"
          unzip -q "candidate/${zip}" -d extracted-candidate
          node scripts/release-audit.mjs extracted-candidate
          printf 'Candidate %s from commit %s\n\n' "$version" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat candidate/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          printf '\nPackaging rehearsal only. Production approval and release gates remain separate.\n' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30
