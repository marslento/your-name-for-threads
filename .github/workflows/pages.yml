name: Pages

# Publishes site/ as the project's GitHub Pages site (Phase 4 Task 32): the home page, /privacy and /support. The files
# are published exactly as they are committed, with no install and no build step, so nothing here runs project code and
# nothing needs a secret. site/privacy/index.html is rendered from PRIVACY.md by `pnpm build:site` and committed, and CI
# fails while it is out of date. Publishing the extension to the stores is a separate workflow behind an approval gate
# (Tasks 37-41) and is not this one.
#
# One-time setup by the repository owner: Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
